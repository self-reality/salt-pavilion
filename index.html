<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>SPAM — Physics Test</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }
        #app {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        /* Bottom-centre stack shown while the pointer is released: exit link,
           can loader (while streaming, inserted by loader-ui.js), controls hint. */
        #menu {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            pointer-events: none;
        }
        #hint {
            font: 14px/1.4 -apple-system, system-ui, sans-serif;
            color: #555;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px 16px;
            text-align: center;
            pointer-events: none;
            user-select: none;
        }
        #hint b { color: #111; }
        #exit {
            pointer-events: auto;
            font: 14px/1.4 -apple-system, system-ui, sans-serif;
            color: #555;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px 24px;
            text-align: center;
            text-decoration: none;
            white-space: nowrap;
            user-select: none;
        }
        #exit b {
            display: block;
            font-size: 32px;
            line-height: 1.2;
            color: #111;
        }
        #exit:hover { background: #fff; border-color: #bbb; }
    </style>
</head>
<body>
    <canvas id="app"></canvas>
    <div id="menu">
        <a id="exit" href="https://history.singularitymuseum.com/">
            <b>Exit pavilion</b>
            (go back to singularity museum main pavilion)
        </a>
        <div id="hint">
            Click to fly &nbsp;·&nbsp; <b>Mouse</b> steer &nbsp;·&nbsp; <b>Q/E</b> roll &nbsp;·&nbsp;
            <b>WASD</b> thrust &nbsp;·&nbsp; <b>R/F</b> up·down &nbsp;·&nbsp;
            <b>Esc</b> to release
        </div>
    </div>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
